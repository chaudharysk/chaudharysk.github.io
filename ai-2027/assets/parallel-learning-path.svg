<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 880" width="1130" height="880" role="group" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Learn AI in 2027: three tracks in parallel</title>
<desc id="diagram-desc">Six parts show maths and code, language models and applications side by side. Select a part name for the lesson.</desc>
<style>text{font-family:system-ui,Arial,sans-serif;fill:#22272b;font-size:16px}.title{font-size:38px;font-weight:700}.header,.part{font-weight:650}.part{fill:#174b8c}.caption{fill:#535e68}.rule{stroke:#dbe0e5}.part-link:hover .part,.part-link:focus .part{text-decoration:underline}</style>
<path fill="#fff" d="M0 0h1130v880H0z"/>
<text x="38" y="66" class="title">Learn AI in 2027</text>
<text x="38" y="101" class="caption">Read across each part to see what to study together.</text>
<path d="M38 130h1054" class="rule"/>
<text x="38" y="158" class="header">Part</text>
<text x="279" y="158" class="header">Maths and code</text>
<text x="550" y="158" class="header">Language models</text>
<text x="820" y="158" class="header">Applications</text>
<path d="M38 176h1054" class="rule"/>
<a href="../study/1-python-and-maths/" class="part-link" aria-label="Python and maths refresher">
<text x="38" y="206" class="part">1. Python and maths</text>
<text x="38" y="228" class="part">refresher</text>
</a>
<text x="279" y="206" class="topic">Python, arrays, tensor</text>
<text x="279" y="228" class="topic">shapes and a few maths</text>
<text x="279" y="250" class="topic">exercises.</text>
<text x="550" y="206" class="topic">Tokens, messages and next-</text>
<text x="550" y="228" class="topic">token prediction. Run an</text>
<text x="550" y="250" class="topic">existing model.</text>
<text x="820" y="206" class="topic">Collect a few documents,</text>
<text x="820" y="228" class="topic">search them and make a</text>
<text x="820" y="250" class="topic">model call.</text>
<path d="M38 283h1054" class="rule"/>
<a href="../study/2-machine-learning-and-nlp/" class="part-link" aria-label="Machine learning and NLP basics">
<text x="38" y="313" class="part">2. Machine learning and</text>
<text x="38" y="335" class="part">NLP basics</text>
</a>
<text x="279" y="313" class="topic">Probability, gradients,</text>
<text x="279" y="335" class="topic">loss functions, data</text>
<text x="279" y="357" class="topic">splits, linear models and</text>
<text x="279" y="379" class="topic">neural networks.</text>
<text x="550" y="313" class="topic">N-grams, TF-IDF,</text>
<text x="550" y="335" class="topic">embeddings, encoders and</text>
<text x="550" y="357" class="topic">decoders.</text>
<text x="820" y="313" class="topic">Search documents by</text>
<text x="820" y="335" class="topic">keyword, label relevant</text>
<text x="820" y="357" class="topic">results and define an</text>
<text x="820" y="379" class="topic">output format.</text>
<path d="M38 390h1054" class="rule"/>
<a href="../study/3-build-a-language-model/" class="part-link" aria-label="Build a language model">
<text x="38" y="420" class="part">3. Build a language</text>
<text x="38" y="442" class="part">model</text>
</a>
<text x="279" y="420" class="topic">The chain rule, matrix</text>
<text x="279" y="442" class="topic">operations, optimisation</text>
<text x="279" y="464" class="topic">and numerical stability.</text>
<text x="550" y="420" class="topic">BPE tokenisation, causal</text>
<text x="550" y="442" class="topic">attention, decoder training</text>
<text x="550" y="464" class="topic">and validation loss.</text>
<text x="820" y="420" class="topic">Embedding search, RAG,</text>
<text x="820" y="442" class="topic">source citations and</text>
<text x="820" y="464" class="topic">handling missing</text>
<text x="820" y="486" class="topic">information.</text>
<path d="M38 497h1054" class="rule"/>
<a href="../study/4-fine-tuning-and-agents/" class="part-link" aria-label="Fine-tuning and agents">
<text x="38" y="527" class="part">4. Fine-tuning and</text>
<text x="38" y="549" class="part">agents</text>
</a>
<text x="279" y="527" class="topic">KL divergence,</text>
<text x="279" y="549" class="topic">regularisation, confidence</text>
<text x="279" y="571" class="topic">intervals and fair</text>
<text x="279" y="593" class="topic">comparisons.</text>
<text x="550" y="527" class="topic">Training data, SFT, LoRA,</text>
<text x="550" y="549" class="topic">chat templates and checks</text>
<text x="550" y="571" class="topic">for worse performance.</text>
<text x="820" y="527" class="topic">A Python tool loop,</text>
<text x="820" y="549" class="topic">argument validation, saved</text>
<text x="820" y="571" class="topic">state and error handling.</text>
<path d="M38 604h1054" class="rule"/>
<a href="../study/5-rlhf-and-reinforcement-learning/" class="part-link" aria-label="RLHF and reinforcement learning">
<text x="38" y="634" class="part">5. RLHF and</text>
<text x="38" y="656" class="part">reinforcement learning</text>
</a>
<text x="279" y="634" class="topic">States, actions, rewards,</text>
<text x="279" y="656" class="topic">expected return, policy</text>
<text x="279" y="678" class="topic">gradients and preference</text>
<text x="279" y="700" class="topic">likelihoods.</text>
<text x="550" y="634" class="topic">Reward models, DPO, RLHF,</text>
<text x="550" y="656" class="topic">and small PPO and GRPO</text>
<text x="550" y="678" class="topic">calculations.</text>
<text x="820" y="634" class="topic">Compare a fixed workflow</text>
<text x="820" y="656" class="topic">with an agent. Test memory</text>
<text x="820" y="678" class="topic">and repeated tool failures.</text>
<path d="M38 711h1054" class="rule"/>
<a href="../study/6-evaluation-and-final-project/" class="part-link" aria-label="Evaluation and a final project">
<text x="38" y="741" class="part">6. Evaluation and a</text>
<text x="38" y="763" class="part">final project</text>
</a>
<text x="279" y="741" class="topic">Paired comparisons,</text>
<text x="279" y="763" class="topic">calibration, effect size</text>
<text x="279" y="785" class="topic">and experimental design.</text>
<text x="550" y="741" class="topic">One research question,</text>
<text x="550" y="763" class="topic">model design choices and</text>
<text x="550" y="785" class="topic">inference costs.</text>
<text x="820" y="741" class="topic">Measure speed and memory,</text>
<text x="820" y="763" class="topic">serve a small system and</text>
<text x="820" y="785" class="topic">finish your project.</text>
<path d="M38 818h1054" class="rule"/>
<text x="38" y="853" class="caption">Read research and evaluate your work throughout the course.</text>
</svg>
