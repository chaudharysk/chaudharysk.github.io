  #workspace-startup { display: none; }
  .workspace-starting .film-desktop { visibility: hidden; }
  .workspace-starting #workspace-startup {
    position: fixed; inset: 0; z-index: 9998; display: grid; place-content: center;
    justify-items: center; gap: 14px; background: #344fc3; color: #fff;
    font: 14px system-ui, sans-serif;

  .startup-monogram {
    display: grid; place-items: center; width: 60px; height: 60px; border-radius: 17px;
    background: #ffffff3d; color: #fff;
    box-shadow: 0 8px 20px #14267054;
    font-size: 23px; font-weight: 700; letter-spacing: -.06em;
  }
  .startup-track { width: 132px; height: 3px; overflow: hidden; border-radius: 8px; background: #9db2f579; }
  .startup-track::after {
    content: ''; display: block; width: 45%; height: 100%; border-radius: inherit;
    background: #fff; animation: startup-sweep 1s ease-in-out infinite alternate;
  }
  @keyframes startup-sweep { from { translate: -100%; } to { translate: 225%; } }
  @media (prefers-reduced-motion: reduce) { .startup-track::after { animation: none; width: 100%; } }
  .motion-off .startup-track::after { animation: none; width: 100%; }
</style>
<script>
  (() => {
    const root = document.documentElement;
    try { if (localStorage.getItem('shashi-motion') === 'off') root.classList.add('motion-off'); } catch {}
    root.classList.add('workspace-starting');
    const reveal = () => {
      clearTimeout(deadline);
      root.classList.remove('workspace-starting');
    };
    // A slow or failed resource must never lock the desktop.
    const deadline = setTimeout(reveal, 7000);
    addEventListener('load', async () => {
      const icons = [...document.querySelectorAll('.desktop-shortcuts img')];
      await Promise.allSettled([document.fonts.ready, ...icons.map(image => image.decode())]);
      reveal();
    }, { once: true });
  })();
</script>
